services:
  django:
    image: "${IMAGE_REPOSITORY:-359655298245.dkr.ecr.ap-south-1.amazonaws.com/techcake-django-app-v3}:${IMAGE_TAG:?Set IMAGE_TAG}"
    env_file:
      - .env
    expose:
      - "8000"
    restart: unless-stopped
    init: true
    networks:
      - app-network
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8000),3); s.close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /techcake/djangov2-task5
        awslogs-create-group: "true"
        awslogs-stream: django

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    depends_on:
      django:
        condition: service_healthy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app-network
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --spider --header='Host: djangov2.tc-2026-0052.nixlabs.in' http://127.0.0.1/ || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: awslogs
      options:
        awslogs-region: ap-south-1
        awslogs-group: /techcake/djangov2-task5
        awslogs-create-group: "true"
        awslogs-stream: nginx

networks:
  app-network:
    driver: bridge